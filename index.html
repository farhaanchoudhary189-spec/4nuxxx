<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillArena - Pro Gaming</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; padding-bottom: 70px; }
        header { background-color: #161b22; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; }
        header h1 { font-size: 20px; color: #58a6ff; letter-spacing: 1px; }
        .wallet-badge { background-color: #21262d; padding: 6px 12px; border-radius: 20px; font-size: 14px; border: 1px solid #30363d; }
        .container { padding: 20px; }
        .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 15px; margin-bottom: 15px; }
        .card h3 { color: #58a6ff; margin-bottom: 8px; font-size: 18px; }
        .card p { font-size: 14px; color: #8b949e; margin-bottom: 12px; }
        .btn { background-color: #238636; color: white; border: none; padding: 10px 15px; border-radius: 6px; font-size: 14px; cursor: pointer; width: 100%; font-weight: bold; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 14px; margin-bottom: 5px; color: #8b949e; }
        .form-group input { width: 100%; padding: 10px; background-color: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: white; font-size: 16px; }
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background-color: #161b22; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #30363d; z-index: 100; }
        .nav-item { color: #8b949e; text-align: center; font-size: 12px; cursor: pointer; }
        .nav-item.active { color: #58a6ff; font-weight: bold; }
        .hidden { display: none !important; }
        .error-msg { color: #f85149; font-size: 13px; margin-top: 5px; text-align: center; }
        .success-msg { color: #3fb950; font-size: 13px; margin-top: 5px; text-align: center; }
    </style>
</head>
<body>

    <header>
        <h1>SkillArena Pro</h1>
        <div id="wallet-display" class="wallet-badge hidden">💰 <span id="balance">0</span> Pts</div>
    </header>

    <div class="container" id="app-container">
        <!-- Dynamic Content -->
    </div>

    <nav class="nav-bar hidden" id="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home')">🏠<br>Home</div>
        <div class="nav-item" onclick="switchTab('wallet')">👛<br>Wallet</div>
        <div class="nav-item" onclick="switchTab('profile')">👤<br>Profile</div>
    </nav>

    <script>
        // TODO: Yahan apni Firebase Console se mili hui configuration key daalein
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUserEmail = null;

        auth.onAuthStateChanged((user) => {
            if (user) {
                currentUserEmail = user.email;
                document.getElementById('wallet-display').classList.remove('hidden');
                document.getElementById('bottom-nav').classList.remove('hidden');
                loadUserData();
                switchTab('home');
            } else {
                currentUserEmail = null;
                renderAuth();
                document.getElementById('wallet-display').classList.add('hidden');
                document.getElementById('bottom-nav').classList.add('hidden');
            }
        });

        function renderAuth() {
            document.getElementById('app-container').innerHTML = `
                <div class="card" style="max-width: 400px; margin: 40px auto;">
                    <h2 style="text-align: center; color: #58a6ff; margin-bottom: 20px;">SkillArena Cloud</h2>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="auth-email" placeholder="Enter email">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="auth-password" placeholder="Enter password">
                    </div>
                    <div id="auth-msg"></div>
                    <button class="btn" onclick="handleLogin()" style="margin-top: 10px;">Login</button>
                    <button class="btn" onclick="handleSignup()" style="background-color: #21262d; border: 1px solid #30363d; margin-top: 10px;">Sign Up</button>
                </div>
            `;
        }

        function handleSignup() {
            const email = document.getElementById('auth-email').value.trim();
            const pass = document.getElementById('auth-password').value.trim();
            const msg = document.getElementById('auth-msg');

            auth.createUserWithEmailAndPassword(email, pass)
                .then((cred) => {
                    // Create Firestore user profile with 500 bonus points
                    return db.collection('users').doc(cred.user.email).set({
                        balance: 500,
                        history: ['Welcome Bonus: +500 Pts']
                    });
                })
                .then(() => {
                    msg.innerHTML = '<p class="success-msg">Account created successfully!</p>';
                })
                .catch((error) => {
                    msg.innerHTML = `<p class="error-msg">${error.message}</p>`;
                });
        }

        function handleLogin() {
            const email = document.getElementById('auth-email').value.trim();
            const pass = document.getElementById('auth-password').value.trim();
            const msg = document.getElementById('auth-msg');

            auth.signInWithEmailAndPassword(email, pass)
                .catch((error) => {
                    msg.innerHTML = `<p class="error-msg">${error.message}</p>`;
                });
        }

        function loadUserData() {
            if(!currentUserEmail) return;
            db.collection('users').doc(currentUserEmail).onSnapshot((doc) => {
                if(doc.exists) {
                    const data = doc.data();
                    document.getElementById('balance').innerText = data.balance;
                    if(document.getElementById('wallet-bal')) {
                        document.getElementById('wallet-bal').innerText = data.balance;
                    }
                }
            });
        }

        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const container = document.getElementById('app-container');
            
            if(tab === 'home') {
                container.innerHTML = `
                    <h2 style="margin-bottom: 15px;">Pro Contests</h2>
                    <div class="card">
                        <h3>Free Fire Pro Series</h3>
                        <p>Entry: 100 Pts | Prize: 500 Pts</p>
                        <button class="btn" onclick="joinContest(100, 500)">Join Contest</button>
                    </div>
                `;
            } else if(tab === 'wallet') {
                db.collection('users').doc(currentUserEmail).get().then((doc) => {
                    const data = doc.data();
                    let historyHtml = data.history.map(item => `<li style="font-size:13px; color:#8b949e; margin-bottom:5px;">${item}</li>`).join('');
                    
                    container.innerHTML = `
                        <h2>Cloud Wallet</h2>
                        <div class="card" style="text-align: center; margin-top: 15px;">
                            <p style="color: #8b949e;">Balance</p>
                            <h1 style="color: #3fb950; font-size: 32px; margin: 10px 0;"><span id="wallet-bal">${data.balance}</span> Pts</h1>
                            <button class="btn" onclick="addMoney(200)" style="background-color: #1f6feb;">Add Test 200 Pts</button>
                        </div>
                        <div class="card">
                            <h3>History</h3>
                            <ul style="list-style: none; padding-top: 10px;">${historyHtml}</ul>
                        </div>
                    `;
                });
            } else if(tab === 'profile') {
                container.innerHTML = `
                    <h2>Profile</h2>
                    <div class="card" style="margin-top: 15px;">
                        <p>Logged in: <strong>${currentUserEmail}</strong></p>
                        <button class="btn" onclick="auth.signOut()" style="background-color: #da3633; margin-top: 20px;">Logout</button>
                    </div>
                `;
            }
        }

        function joinContest(entry, prize) {
            const userRef = db.collection('users').doc(currentUserEmail);
            db.runTransaction((transaction) => {
                return transaction.get(userRef).then((doc) => {
                    let newBal = doc.data().balance - entry;
                    if (newBal < 0) throw "Insufficient balance!";
                    let history = doc.data().history;
                    history.unshift(`Contest Joined: -${entry} Pts`);
                    transaction.update(userRef, { balance: newBal, history: history });
                });
            }).then(() => {
                alert('Successfully joined contest!');
            }).catch((err) => {
                alert(err);
            });
        }

        function addMoney(amount) {
            const userRef = db.collection('users').doc(currentUserEmail);
            db.runTransaction((transaction) => {
                return transaction.get(userRef).then((doc) => {
                    let newBal = doc.data().balance + amount;
                    let history = doc.data().history;
                    history.unshift(`Added Points: +${amount} Pts`);
                    transaction.update(userRef, { balance: newBal, history: history });
                });
            });
        }
    </script>
</body>
</html>
